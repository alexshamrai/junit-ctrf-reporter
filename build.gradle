plugins {
    id 'java'
    id 'signing'
    id 'checkstyle'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.alexshamrai'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava {
    options.release = 17
    options.encoding = 'UTF-8'
}

ext {
    projectVersion = '0.4.6-SNAPSHOT'
    releaseVersion = '0.4.5'

    junitVersion = '6.1.3'
    // The oldest JUnit the library supports (the compat matrix's lowest entry). Main code compiles
    // against it, so an API that only newer JUnit versions have fails the build. renovate.json keeps it on 5.10.x.
    junitMinVersion = '5.10.5'
    lombokVersion = '1.18.48'
    jaksonVersion = '2.22.3'
    ownerVersion = '1.0.12'
    mockitoVersion = '5.24.0'
    assertjVersion = '3.27.7'

    slf4jVersion = '2.0.20'
    logbackVersion = '1.6.5'
    jacksonModuleJsonSchemaVersion = '2.22.3'
    jsonSchemaValidatorVersion = '2.2.14'
}

version = projectVersion

dependencies {
    // JUnit comes from the consumer's own test runtime: compile against it, never publish it
    compileOnly platform("org.junit:junit-bom:${junitMinVersion}")
    compileOnly "org.junit.jupiter:junit-jupiter-api"
    compileOnly "org.junit.platform:junit-platform-launcher"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jaksonVersion}"
    implementation "org.aeonbits.owner:owner:${ownerVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
}

test {
    useJUnitPlatform()
}

checkstyle {
    toolVersion = '13.11.0'
    configFile = file("${project.rootDir}/config/checkstyle/checkstyle.xml")
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
    // -PpublishVersion lets compat/run.sh publish a throwaway version without touching the release one
    coordinates("io.github.alexshamrai", "junit-ctrf-reporter", "${findProperty('publishVersion') ?: releaseVersion}")
    pom {
        name = "Junit CTRF Extension"
        description = "Junit extension to create test reports that follow the CTRF standard."
        inceptionYear = "2024"
        url = "https://github.com/alexshamrai/junit-ctrf-reporter"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "alexshamrai"
                name = "Oleksii Shamrai"
                url = "https://github.com/alexshamrai/"
            }
        }
        scm {
            url = "https://github.com/alexshamrai/junit-ctrf-reporter"
            connection = "scm:git:git://github.com/alexshamrai/junit-ctrf-reporter.git"
            developerConnection = "scm:git:ssh://git@github.com/alexshamrai/junit-ctrf-reporter.git"
        }
    }
}
// Enable in-memory GPG signing for CI/CD environments
afterEvaluate {
    signing {
        def signingKey = findProperty("signingInMemoryKey")
        def signingPassword = findProperty("signingInMemoryKeyPassword")
        if (signingKey && signingPassword) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
    }
}

// Local repository for the consumer-compatibility check (compat/run.sh)
publishing {
    repositories {
        maven {
            name = 'compat'
            url = layout.buildDirectory.dir('compat-repo')
        }
    }
}

// Skip signing for local Maven publishing and the compat repository
tasks.withType(Sign).configureEach {
    enabled = !gradle.startParameter.taskNames.any { it.contains('MavenLocal') || it.contains('CompatRepository') }
}

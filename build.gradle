plugins {
    id 'java'
    id 'signing'
    id 'checkstyle'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.alexshamrai'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
}

// The jar runs on Java 17 or later, whatever JDK builds it
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

ext {
    projectVersion = '0.5.3-SNAPSHOT'
    releaseVersion = '0.5.2'

    junitVersion = '6.1.3'
    // The oldest supported JUnit: main code compiles against it. renovate.json keeps it on 5.10.x
    junitMinVersion = '5.10.5'
    lombokVersion = '1.18.48'
    jacksonVersion = '3.2.4'
    mockitoVersion = '5.24.0'
    assertjVersion = '3.27.7'

    slf4jVersion = '2.0.20'
    logbackVersion = '1.6.5'
    networkntValidatorVersion = '3.0.8'
}

version = projectVersion

dependencies {
    // JUnit comes from the consumer's own test runtime: compile against it, never publish it
    compileOnly platform("org.junit:junit-bom:${junitMinVersion}")
    compileOnly "org.junit.jupiter:junit-jupiter-api"
    compileOnly "org.junit.platform:junit-platform-launcher"
    // For users who read the model with their own Jackson 2 or 3; not needed at run time, so not published
    compileOnly platform("tools.jackson:jackson-bom:${jacksonVersion}")
    compileOnly "com.fasterxml.jackson.core:jackson-annotations"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.platform:junit-platform-launcher"
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testImplementation "org.junit.platform:junit-platform-testkit"
    // A @Suite fixture, to show that suite skips the engines of a suite too
    testImplementation "org.junit.platform:junit-platform-suite"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation platform("tools.jackson:jackson-bom:${jacksonVersion}")
    testImplementation "tools.jackson.core:jackson-databind"
    testImplementation "com.networknt:json-schema-validator:${networkntValidatorVersion}"
    // A logging provider for the validator, so tests don't print SLF4J's "no providers" warning
    testRuntimeOnly "org.slf4j:slf4j-nop:${slf4jVersion}"
}

sourceSets {
    test {
        resources {
            // The pinned official CTRF schema; see schema/README.md
            srcDir 'schema'
            exclude 'README.md'
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform {
        // Scenario fixtures fail on purpose; ScenarioRunner runs them in a separate JVM
        excludeTags 'scenario-fixture'
        // The suite engine is here only for a @Suite fixture that a test discovers itself
        excludeEngines 'junit-platform-suite'
    }
}

// The unit tests and scenarios again, on the older Java versions users run
[17, 21].each { javaVersion ->
    def testOnJava = tasks.register("testOnJava${javaVersion}", Test) {
        description = "Runs the unit tests and scenarios on Java ${javaVersion}."
        group = LifecycleBasePlugin.VERIFICATION_GROUP
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        // Its own report: in the default ctrf-report.json, the same tests on two JDKs would fold into retries
        systemProperty 'ctrf.report.path',
            "${layout.buildDirectory.get().asFile}/test-results/testOnJava${javaVersion}/ctrf-report.json"
    }
    tasks.named('check') {
        dependsOn testOnJava
    }
}

checkstyle {
    toolVersion = '14.3.0'
    configFile = file("${project.rootDir}/config/checkstyle/checkstyle.xml")
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
    // -PpublishVersion lets compat/run.sh publish a throwaway version without touching the release one
    coordinates("io.github.alexshamrai", "junit-ctrf-reporter", "${findProperty('publishVersion') ?: releaseVersion}")
    pom {
        name = "Junit CTRF Extension"
        description = "Junit extension to create test reports that follow the CTRF standard."
        inceptionYear = "2024"
        url = "https://github.com/alexshamrai/junit-ctrf-reporter"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "alexshamrai"
                name = "Oleksii Shamrai"
                url = "https://github.com/alexshamrai/"
            }
        }
        scm {
            url = "https://github.com/alexshamrai/junit-ctrf-reporter"
            connection = "scm:git:git://github.com/alexshamrai/junit-ctrf-reporter.git"
            developerConnection = "scm:git:ssh://git@github.com/alexshamrai/junit-ctrf-reporter.git"
        }
    }
}
// Enable in-memory GPG signing for CI/CD environments
afterEvaluate {
    signing {
        def signingKey = findProperty("signingInMemoryKey")
        def signingPassword = findProperty("signingInMemoryKeyPassword")
        if (signingKey && signingPassword) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
    }
}

// Local repository for the consumer-compatibility check (compat/run.sh)
publishing {
    repositories {
        maven {
            name = 'compat'
            url = layout.buildDirectory.dir('compat-repo')
        }
    }
}

tasks.withType(Sign).configureEach {
    enabled = !gradle.startParameter.taskNames.any { it.contains('MavenLocal') || it.contains('CompatRepository') }
}

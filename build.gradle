plugins {
    id 'java'
    id 'signing'
    id 'checkstyle'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'io.github.alexshamrai'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava {
    options.release = 17
    options.encoding = 'UTF-8'
}

ext {
    projectVersion = '0.5.1-SNAPSHOT'
    releaseVersion = '0.5.0'

    junitVersion = '6.1.3'
    // The oldest JUnit the library supports (the compat matrix's lowest entry). Main code compiles
    // against it, so an API that only newer JUnit versions have fails the build. renovate.json keeps it on 5.10.x.
    junitMinVersion = '5.10.5'
    lombokVersion = '1.18.48'
    jaksonVersion = '2.22.2'
    mockitoVersion = '5.23.0'
    assertjVersion = '3.27.7'

    slf4jVersion = '2.0.19'
    logbackVersion = '1.6.3'
    networkntValidatorVersion = '3.0.8'
}

version = projectVersion

dependencies {
    // JUnit comes from the consumer's own test runtime: compile against it, never publish it
    compileOnly platform("org.junit:junit-bom:${junitMinVersion}")
    compileOnly "org.junit.jupiter:junit-jupiter-api"
    compileOnly "org.junit.platform:junit-platform-launcher"
    // The model keeps its Jackson annotations for users who read it with their own Jackson. The library doesn't use
    // them at run time, so they are compile-only and the published POM has no dependencies
    compileOnly platform("com.fasterxml.jackson:jackson-bom:${jaksonVersion}")
    compileOnly "com.fasterxml.jackson.core:jackson-annotations"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.platform:junit-platform-launcher"
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    // Runs fixture classes on the Jupiter engine inside a test, to check what the extension does to their outcomes
    testImplementation "org.junit.platform:junit-platform-testkit"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    // Jackson wrote the reports up to 0.5.0: the tests compare the library's own JSON code with it, and read reports with it
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${jaksonVersion}"
    // Validates reports against the pinned official CTRF schema. It uses Jackson 3 (tools.jackson), apart from the tests' Jackson 2
    testImplementation "com.networknt:json-schema-validator:${networkntValidatorVersion}"
    // A logging provider for the validator, so tests don't print SLF4J's "no providers" warning
    testRuntimeOnly "org.slf4j:slf4j-nop:${slf4jVersion}"
}

sourceSets {
    test {
        resources {
            // The pinned official CTRF schema; see schema/README.md
            srcDir 'schema'
            exclude 'README.md'
        }
    }
}

test {
    useJUnitPlatform {
        // Scenario fixtures fail on purpose; ScenarioRunner runs them in a separate JVM
        excludeTags 'scenario-fixture'
    }
}

checkstyle {
    toolVersion = '13.11.0'
    configFile = file("${project.rootDir}/config/checkstyle/checkstyle.xml")
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
    // -PpublishVersion lets compat/run.sh publish a throwaway version without touching the release one
    coordinates("io.github.alexshamrai", "junit-ctrf-reporter", "${findProperty('publishVersion') ?: releaseVersion}")
    pom {
        name = "Junit CTRF Extension"
        description = "Junit extension to create test reports that follow the CTRF standard."
        inceptionYear = "2024"
        url = "https://github.com/alexshamrai/junit-ctrf-reporter"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "alexshamrai"
                name = "Oleksii Shamrai"
                url = "https://github.com/alexshamrai/"
            }
        }
        scm {
            url = "https://github.com/alexshamrai/junit-ctrf-reporter"
            connection = "scm:git:git://github.com/alexshamrai/junit-ctrf-reporter.git"
            developerConnection = "scm:git:ssh://git@github.com/alexshamrai/junit-ctrf-reporter.git"
        }
    }
}
// Enable in-memory GPG signing for CI/CD environments
afterEvaluate {
    signing {
        def signingKey = findProperty("signingInMemoryKey")
        def signingPassword = findProperty("signingInMemoryKeyPassword")
        if (signingKey && signingPassword) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
    }
}

// Local repository for the consumer-compatibility check (compat/run.sh)
publishing {
    repositories {
        maven {
            name = 'compat'
            url = layout.buildDirectory.dir('compat-repo')
        }
    }
}

// Skip signing for local Maven publishing and the compat repository
tasks.withType(Sign).configureEach {
    enabled = !gradle.startParameter.taskNames.any { it.contains('MavenLocal') || it.contains('CompatRepository') }
}

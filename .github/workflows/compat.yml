name: Consumer compatibility

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  compat:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        junit: ['5.10.5', '5.14.4', '6.1.3']

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run consumer compatibility checks with JUnit ${{ matrix.junit }}
        run: compat/run.sh ${{ matrix.junit }}

      - name: Upload consumer build logs
        uses: actions/upload-artifact@v7
        with:
          name: compat-logs-junit-${{ matrix.junit }}
          path: build/compat-logs
        if: failure()

name: Consumer compatibility

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  compat:
    name: compat (Java ${{ matrix.java }}, JUnit ${{ matrix.junit }})

    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # The Java versions users run the published jar on: the consumers build and test on each
        java: ['17', '21', '25']
        junit: ['5.10.5', '5.14.4', '6.1.3']

    steps:
      - uses: actions/checkout@v7
      # 25 builds the library; ${{ matrix.java }}, listed last, is JAVA_HOME, so the consumers build and test on it
      - name: Set up JDK 25 and JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: |
            25
            ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run consumer compatibility checks with JUnit ${{ matrix.junit }} on Java ${{ matrix.java }}
        run: |
          java -version
          compat/run.sh ${{ matrix.junit }}

      - name: Upload consumer build logs
        uses: actions/upload-artifact@v7
        with:
          name: compat-logs-java-${{ matrix.java }}-junit-${{ matrix.junit }}
          path: build/compat-logs
        if: failure()

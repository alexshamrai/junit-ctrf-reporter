name: Build and run Unit tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - test/timeline-report

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      # 17 and 21 run the tests on older Java (testOnJava17, testOnJava21); 25, listed last, runs Gradle and the build
      - name: Set up JDKs 17, 21 and 25
        uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build -x test -x testOnJava17 -x testOnJava21

      - name: Run unit tests on Java 25, 17 and 21
        run: ./gradlew :test :testOnJava17 :testOnJava21 --continue
      - name: Publish CTRF Test Report
        uses: alexshamrai/github-test-reporter@feature/timeline-report
        with:
          report-path: 'ctrf-report.json'
          summary-report: true
          failed-report: true
          timeline-report: true
        if: always()
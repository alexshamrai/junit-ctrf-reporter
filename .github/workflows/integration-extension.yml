name: Extension Integration tests

on:
  workflow_dispatch:
    inputs:
      threads:
        description: 'Threads'
        default: '2'
        required: false
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      REPORT_FILE: 'integration-tests-extension/build/test-results/ctrf-report.json'
      # Passed to both the report step and the validator, which takes its expectations from them
      RUN_FLAGS: >-
        -Dthreads=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.threads || '2' }}
        -Dctrf.build.name=system-build
        -Dctrf.build.number=${{ github.run_number }}
        -Dctrf.build.url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate report with extension
        run: ./gradlew :integration-tests-extension:test $RUN_FLAGS
        if: always()

      - name: Publish CTRF Test Report
        uses: ctrf-io/github-test-reporter@v1.3.2
        with:
          report-path: ${{ env.REPORT_FILE }}

          summary-report: true
          test-report: true
          fail-rate-report: true
          failed-folded-report: true
          previous-results-report: true
          skipped-report: true

          annotate: true
          previous-results-max: 10
          artifact-name: 'ctrf-report'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()

      - name: Run integration tests
        run: ./gradlew :integration-ctrf-validator:test $RUN_FLAGS -Dctrf.report.path=../${{ env.REPORT_FILE }}
        if: always()

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: ctrf-report
          path: integration-tests-extension/build/test-results
        if: always()

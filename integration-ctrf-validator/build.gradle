plugins {
    id 'java'
}

group = rootProject.group
version = rootProject.ext.projectVersion

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${rootProject.ext.logbackVersion}"

    implementation platform("tools.jackson:jackson-bom:${rootProject.ext.jacksonVersion}")
    implementation "tools.jackson.core:jackson-databind"
    implementation "com.networknt:json-schema-validator:${rootProject.ext.networkntValidatorVersion}"

    testImplementation platform("org.junit:junit-bom:${rootProject.ext.junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation project(':')

    testImplementation "org.assertj:assertj-core:${rootProject.ext.assertjVersion}"
}

sourceSets {
    test {
        resources {
            // The pinned official CTRF schema; see schema/README.md
            srcDir rootProject.file('schema')
            exclude 'README.md'
        }
    }
}

def configureThreads(Test task) {
    def threads = System.getProperty("threads")
    println "${task.name} - Configured number of threads: ${threads ?: 'not set'}"

    if (threads?.isInteger()) {
        def threadsNumber = threads.toInteger()
        if (threadsNumber > 1) {
            task.systemProperties += [
                    'junit.jupiter.execution.parallel.enabled'                   : true,
                    'junit.jupiter.execution.parallel.mode.default'              : 'concurrent',
                    'junit.jupiter.execution.parallel.mode.classes.default'      : 'concurrent',
                    'junit.jupiter.execution.parallel.config.strategy'           : 'fixed',
                    'junit.jupiter.execution.parallel.config.fixed.parallelism'  : threadsNumber,
                    'junit.jupiter.execution.parallel.config.fixed.max-pool-size': threadsNumber
            ]
        }
    } else {
        println "Invalid or missing 'threads' property. Default settings will be used."
    }
}

test {
    useJUnitPlatform()

    // The same -Dctrf.* and -Dthreads flags as the integration run: the expectations come from them (ExpectedRun)
    systemProperties += System.properties.findAll { k, v -> k.toString().startsWith("ctrf") || k == "threads" }

    // One command can run an integration module and then validate its report
    mustRunAfter ':integration-tests-listener:test', ':integration-tests-extension:test'

    // The report and JUnit's event log aren't declared inputs, so always validate
    outputs.upToDateWhen { false }
}

// Explicitly mark this module as not for publishing
jar {
    enabled = true  // We want the jar for local use
    archiveClassifier = 'tests'  // Mark as tests artifact
}

// Explicitly disable all publishing tasks
tasks.matching { it.name.contains('publish') }.configureEach {
    enabled = false
}

// Disable Maven publication configurations
tasks.withType(GenerateMavenPom).configureEach {
    enabled = false
}

tasks.withType(PublishToMavenRepository).configureEach {
    enabled = false
}

tasks.withType(PublishToMavenLocal).configureEach {
    enabled = false
}